name: oria
description: Oria - controle financeiro mobile-first da casa.
publish_to: 'none'
version: 0.10.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  licenses:
    - assets/fonts/OFL-Roboto.txt

  assets:
    - assets/images/oria_logo.png

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Variable.ttf
          weight: 700
